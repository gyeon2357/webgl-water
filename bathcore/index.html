<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Poolcore</title>
  <meta name="description" content="A Poolcore / Cleancore aesthetic Three.js">
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
  <style type="text/css">
    html,
    body {
      margin: 0;
      padding: 0;
      /* Locked by default so the page can't be scrolled (wheel, touch
         drag, keyboard, scrollbar) while the intro splash is up - lifted
         once the intro actually finishes (see .intro-done below). */
      overflow: hidden;
      height: 100%;
    }

    html.intro-done,
    body.intro-done {
      overflow: auto;
      height: auto;
    }

    body {
      background: black;
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    img {
      display: none;
    }

    /*
      Hero scroll behaviour:
      - #hero-wrapper is taller than the viewport (100% visible + 40% extra
        "budget"). #hero-pin is sticky inside it, so it stays pinned on
        screen for that extra 40svh of scrolling/swiping before the next
        section (#brand-intro) is allowed to scroll into view.
      - The 40vh fallback is for browsers that don't understand svh yet;
        the svh rule right after it wins wherever it's supported.
    */
    #hero-wrapper {
      position: relative;
      height: 140vh;
      height: 140svh;
    }

    #hero-pin {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: black;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    /*
      Intro splash: a full-screen white cover with the logo, held on
      screen briefly then cleared via a circular reveal that opens from
      the center outward (driven frame-by-frame from app.ts via a CSS
      mask, not a CSS transition - see playCircleReveal). Also doubles as
      a buffer so the water/fruit setup underneath has time to run before
      it's revealed.
    */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      z-index: 5;
    }

    #intro-logo {
      /* Overrides the global `img { display: none; }` rule above (used to
         keep the hidden source <img> for the tile texture out of the
         layout) - this one is the actual visible intro logo. */
      display: block;
      width: 200px;
      max-width: 55vw;
      height: auto;
      opacity: 0;
      transition: opacity 1.1s ease;
    }

    #intro-logo.intro-logo-show {
      opacity: 1;
    }

    #skip-intro {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.6);
      color: black;
      font-family: inherit;
      font-size: 12px;
    
      cursor: pointer;
      backdrop-filter: blur(8px);
      /* Hidden during the intro splash; revealed once it's done. */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #skip-intro.skip-visible {
      opacity: 1;
      pointer-events: auto;
    }

    #skip-intro:hover {
      background: rgba(0, 0, 0, 0.55);
    }

    #skip-intro svg {
      width: 14px;
      height: 14px;
    }

    /* Placeholder next section - real brand/reservation content comes later. */
    #brand-intro {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      background: #f5f2ec;
      color: #1a1a1a;
      padding: 40px 24px;
      box-sizing: border-box;
    }

    #brand-intro h2 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
    }

    #brand-intro p {
      margin: 0;
      color: #666;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div id="hero-wrapper">
    <div id="hero-pin">
      <div id="loading"><img id="intro-logo" src="/logo.png" alt="usana"></div>
      <button id="skip-intro" type="button">
        Skip
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M12 5v14M5 12l7 7 7-7" />
        </svg>
      </button>
    </div>
  </div>

  <section id="brand-intro">
    <h2>브랜드 소개</h2>
    <p>asdf</p>
  </section>

  <img id="tiles" src="/tiles2_1.jpg" />
  <img id="sky" src="/sky2.jpg" />

  <script type="module" src="/src/main.ts"></script>


  <style>
    .github-corner {
      position: absolute;
      border: 0;
      z-index: 9999;
    }

    .github-corner:hover .octo-arm {
      animation: octocat-wave 560ms ease-in-out
    }

    @keyframes octocat-wave {

      0%,
      100% {
        transform: rotate(0)
      }

      20%,
      60% {
        transform: rotate(-25deg)
      }

      40%,
      80% {
        transform: rotate(10deg)
      }
    }

    @media (max-width:500px) {
      .github-corner:hover .octo-arm {
        animation: none
      }

      .github-corner .octo-arm {
        animation: octocat-wave 560ms ease-in-out
      }
    }
  </style>
</body>

</html>
