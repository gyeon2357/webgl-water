name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build seacore
        working-directory: seacore
        run: |
          npm ci
          npm run build
      - name: Build bathcore
        working-directory: bathcore
        run: |
          npm ci
          npm run build
      - name: Assemble combined site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r seacore/dist _site/seacore
          cp -r bathcore/dist _site/bathcore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
